<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-color: #000;
      --second-color: #fff;
    }

    html {
      transition: all 0.5s ease-in;
    }

    html.dark {
      --priamry-color: #fff;
      --second-color: #333;
      background-color: #111;
      color: var(--primary-color);
    }

    html.dark body {
      background-color: #111;
    }

    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      flex-direction: column;
    }

    .toggle {
      background-color: var(--primary-color);
      color: var(--second-color);
      border: 0;
      border-radius: 4px;
      padding: 8px 12px;
      position: absolute;
      top: 100px;
      cursor: pointer;
    }

    .toggle:focus {
      outline: none;
    }

    .clock-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .clock {
      position: relative;
      width: 200px;
      height: 200px;
    }

    .needle {
      background-color: var(--primary-color);
      position: absolute;
      top: 50%;
      left: 50%;
      height: 3px;
      width: 100px;
      transform-origin: left center;
      transition: transform 0.5s ease-in;
    }

    .hour {
      height: 4px;
      width: 65px;
      background-color: var(--primary-color);
    }

    .minute {
      height: 3px;
      width: 100px;
      background-color: var(--primary-color);
    }

    .second {
      background-color: #e74c3c;
      height: 2px;
      width: 100px;
    }

    .center-point {
      background-color: #e74c3c;
      width: 10px;
      height: 10px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
    }

    html.dark .center-point {
      background-color: #e74c3c;
    }

    html.dark .second {
      background-color: #e74c3c;
    }

    .time {
      font-size: 60px;
      color: var(--primary-color);
    }

    .date {
      color: #aaa;
      font-size: 14px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .date span {
      background-color: var(--primary-color);
      color: var(--second-color);
      border-radius: 50%;
      height: 18px;
      width: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      line-height: 12px;
    }
  </style>
</head>

<body>
  <button class="toggle">Dark Mode</button>
  <div class="clock-container">
    <div class="clock">
      <div class="needle hour"></div>
      <div class="needle minute"></div>
      <div class="needle second"></div>
      <div class="center-pointer"></div>
    </div>
    <div class="time"></div>
    <div class="date"></div>
  </div>
  <script src="script.js"></script>
  <script>
    const hourEl = document.querySelector('.hour')
    const minuteEl = document.querySelector('.minute')
    const secondEl = document.querySelector('.second')
    const timeEl = document.querySelector('.time')
    const dateEl = document.querySelector('.date')
    const toggle = document.querySelector('.toggle')

    const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    toggle.addEventListener('click', (e) => {
      const html = document.querySelector('html')
      if (html.classList.contains('dark')) {
        html.classList.remove('dark')
        e.target.innerHTML = 'Dark mode'
      } else {
        html.classList.add('dark')
        e.target.innerHTML = 'Light mode'
      }
    })

    const scale = (num, in_min, in_max, out_min, out_max) => {
      return (num - in_min) * (out_max - out_min) / (in_max - in_min) + out_min;
    }

    function setTime() {
      const time = new Date();
      const month = time.getMonth();
      const day = time.getDay();
      const date = time.getDate();
      const hours = time.getHours();
      const hoursForClock = hours >= 13 ? hours % 12 : hours;
      const minutes = time.getMinutes();
      const seconds = time.getSeconds();
      const ampm = hours >= 12 ? 'PM' : 'AM';

      hourEl.style.transform = `translate(-50%, -100%) rotate(${scale(hoursForClock, 0, 11, 0, 360)}deg)`
      hourEl.style.transform = `rotate(${scale(hoursForClock, 0, 12, 0, 360) - 90}deg)`
      minuteEl.style.transform = `rotate(${scale(minutes, 0, 60, 0, 360) - 90}deg)`
      secondEl.style.transform = `rotate(${scale(seconds, 0, 60, 0, 360) - 90}deg)`

      timeEl.innerHTML = `${hoursForClock}:${minutes < 10 ? `0${minutes}` : minutes} ${ampm}`

      dateEl.innerHTML = `${days[day]}, ${months[month]} <span class="circle">${date}</span>`
    }

    setInterval(setTime, 1000)

  </script>
</body>

</html>
