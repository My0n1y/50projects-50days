<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../imgs/font_suoqy8ty5aj/iconfont.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: center;
      flex-direction: column;
      overflow: hidden;
      margin: 0;
      min-height: 100vh;
    }

    .photo {
      width: 250px;
      height: 400px;
      background-color: #000;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.25), 0 10px 10px rgba(0, 0, 0, 0.22);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h2 {
      margin-top: 20px;
    }

    h2 span.icon-aixin {
      color: red;
    }

    h4 {
      margin: 20px;
    }

    .photo .iconfont {
      position: absolute;
      color: red;
      font-size: 20px;
      transform: translate(-50%, -50%) scale(0);
      animation: grow 0.6s ease-out;
    }

    @keyframes grow {
      to {
        transform: translate(-50%, -50%) scale(8);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <h2>
    Double click on the image to <span class="iconfont icon-aixin"></span> it
  </h2>
  <h4>You liked it <span id="times">0</span> times</h4>
  <div class="photo">
    <img src="../imgs/project_29/photo-1504215680853-026ed2a45def.jpg" alt="图片暂时无法加载">
  </div>
  <script>
    const photoEl = document.querySelector('.photo')
    const times = document.querySelector('#times')
    let clickCount = 0
    photoEl.addEventListener('dblclick', (e) => {
      createHeart(e)
    })

    const createHeart = (e) => {
      const heart = document.createElement('i')
      heart.classList.add('icon-aixin')
      heart.classList.add('iconfont')
      const x = e.clientX
      const y = e.clientY
      const leftOffset = photoEl.getBoundingClientRect().left
      const topOffset = photoEl.getBoundingClientRect().top

      const xInside = x - leftOffset
      const yInside = y - topOffset
      heart.style.top = `${yInside}px`
      heart.style.left = `${xInside}px`
      photoEl.appendChild(heart)
      times.innerHTML = ++clickCount
      setTimeout(() => heart.remove(), 600)
    }
  </script>
</body>

</html>
