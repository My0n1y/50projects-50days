<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profiles</title>
  <style>
    /* 基础样式复位 */
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #28223f;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      margin: 0;
    }

    /* 搜索表单 */
    .user-form {
      width: 100%;
      max-width: 700px;
    }

    .user-form input {
      width: 100%;
      display: block;
      background-color: #4c2885;
      border: none;
      border-radius: 10px;
      color: #fff;
      padding: 1rem;
      margin-bottom: 2rem;
      font-family: inherit;
      font-size: 1rem;
      box-shadow: 0 5px 10px rgba(154, 160, 185, 0.05), 0 15px 40px rgba(0, 0, 0, 0.1);
    }

    .user-form input::placeholder {
      color: #bbb;
    }

    .user-form input:focus {
      outline: none;
    }

    /* 用户卡片样式 */
    .card {
      max-width: 800px;
      background-color: #4c2885;
      border-radius: 20px;
      box-shadow: 0 5px 10px rgba(154, 160, 185, 0.05), 0 15px 40px rgba(0, 0, 0, 0.1);
      display: flex;
      padding: 3rem;
      margin: 0 1.5rem;
    }

    .avatar {
      border-radius: 50%;
      border: 10px solid #28223f;
      height: 150px;
      width: 150px;
    }

    .user-info {
      color: #eee;
      margin-left: 2rem;
    }

    .user-info h2 {
      margin-top: 0;
    }

    .user-info ul {
      list-style-type: none;
      display: flex;
      justify-content: space-between;
      padding: 0;
      max-width: 400px;
    }

    .user-info ul li {
      display: flex;
      align-items: center;
    }

    .user-info ul li strong {
      font-size: 0.9rem;
      margin-left: 0.5rem;
    }

    /* 仓库链接样式 */
    .repo {
      text-decoration: none;
      color: #fff;
      background-color: #212a72;
      font-size: 0.7rem;
      padding: 0.25rem 0.5rem;
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
      display: inline-block;
    }

    /* 移动端适配 */
    @media (max-width: 500px) {
      .card {
        flex-direction: column;
        align-items: center;
      }

      .user-info {
        margin-left: 0;
        margin-top: 1rem;
        text-align: center;
      }

      .user-info ul {
        justify-content: center;
        gap: 10px;
      }
    }
  </style>
</head>

<body>

  <form class="user-form" id="form">
    <input type="text" id="search" placeholder="Search a Github User..." autocomplete="off">
  </form>

  <main id="main"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.0/axios.min.js"></script>
  <script>
    const APIURL = 'https://api.github.com/users/'

    const main = document.getElementById('main')
    const form = document.getElementById('form')
    const search = document.getElementById('search')

    // 1. 获取用户信息
    async function getUser(username) {
      try {
        const { data } = await axios(APIURL + username)
        createUserCard(data)
        getRepos(username)
      } catch (err) {
        if (err.response && err.response.status == 404) {
          createErrorCard('没有找到该用户')
        }
      }
    }

    // 2. 获取仓库信息 (最近 5 个)
    async function getRepos(username) {
      try {
        const { data } = await axios(APIURL + username + '/repos?sort=created')
        addReposToCard(data)
      } catch (err) {
        createErrorCard('获取仓库列表失败')
      }
    }

    // 3. 动态生成卡片 HTML
    function createUserCard(user) {
      const cardHTML = `
            <div class="card">
                <div>
                    <img src="${user.avatar_url}" alt="${user.name}" class="avatar">
                </div>
                <div class="user-info">
                    <h2>${user.name || user.login}</h2>
                    <p>${user.bio || '这个用户很懒，什么都没写'}</p>
                    <ul>
                        <li>${user.followers} <strong>粉丝</strong></li>
                        <li>${user.following} <strong>关注</strong></li>
                        <li>${user.public_repos} <strong>仓库</strong></li>
                    </ul>
                    <div id="repos"></div>
                </div>
            </div>
            `
      main.innerHTML = cardHTML
    }

    // 4. 错误处理卡片
    function createErrorCard(msg) {
      const cardHTML = `
                <div class="card">
                    <h1>${msg}</h1>
                </div>
            `
      main.innerHTML = cardHTML
    }

    // 5. 渲染仓库标签
    function addReposToCard(repos) {
      const reposEl = document.getElementById('repos')
      repos
        .slice(0, 5) // 只取前 5 个
        .forEach(repo => {
          const repoLink = document.createElement('a')
          repoLink.classList.add('repo')
          repoLink.href = repo.html_url
          repoLink.target = '_blank'
          repoLink.innerText = repo.name
          reposEl.appendChild(repoLink)
        })
    }

    // 6. 监听表单提交
    form.addEventListener('submit', (e) => {
      e.preventDefault()
      const user = search.value
      if (user) {
        getUser(user)
        search.value = ''
      }
    })
  </script>
</body>

</html>
